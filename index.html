<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expedientes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
#downloads{display:none;padding:16px;overflow:auto;height:100%}
nav{display:flex;border-top:1px solid #ddd;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px;border:0;background:none;font-size:15px}
nav button.on{color:#16a34a;font-weight:700;border-top:3px solid #16a34a}
#fab{position:absolute;right:16px;bottom:16px;z-index:1000;width:56px;height:56px;border-radius:50%;border:0;background:#16a34a;color:#fff;font-size:32px;box-shadow:0 2px 8px #0005}
.modal{position:fixed;inset:0;background:#0007;z-index:2000;display:none;align-items:center;justify-content:center;padding:12px}
.card{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
.row{display:flex;gap:6px}.row .ref{flex:2}.row .tipo{flex:1}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-size:14px;margin:4px 4px 0 0}
.btn.g{background:#e5e7eb;color:#111}.btn.b{background:#2563eb}.btn.r{background:#dc2626}
.exp{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:9000;display:none;font-size:14px}
#geo{position:absolute;right:16px;bottom:84px;z-index:1000;width:48px;height:48px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:0 2px 8px #0005}
#filtBtn{position:absolute;left:12px;top:12px;z-index:1000;padding:10px 14px;border:0;border-radius:20px;background:#fff;font-size:14px;box-shadow:0 2px 8px #0005}
#filt{position:absolute;left:12px;top:56px;z-index:1000;background:#fff;border-radius:12px;padding:12px;width:230px;box-shadow:0 2px 8px #0005;display:none}
#filt label{font-size:12px;color:#555}
#auth{z-index:4000;background:#fff;display:none}
#auth h2{margin:0 0 8px;color:#16a34a}
.plab{background:none!important;border:0!important;box-shadow:none!important;color:#fff;font-weight:700;font-size:12px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;white-space:nowrap;padding:0!important}
.plab:before{display:none!important}
.nolab .plab{display:none}
.exp{flex-wrap:wrap}
.row .x{margin:4px 0!important}
</style></head>
<body>
<div id="app">
 <main>
  <div id="map"></div>
  <button id="fab" title="Añadir expediente">+</button>
  <button id="geo" title="Mi ubicación">&#128205;</button>
  <button id="filtBtn">Filtros</button>
  <div id="filt">
   <label>Expediente</label><select id="fExp"></select>
   <label>Tipo</label><select id="fTipo"></select>
   <label>Estado del expediente</label>
   <select id="fEstado"><option value="">Todos</option><option value="pendiente">Pendiente (verde)</option><option value="en_curso">En curso (amarillo)</option><option value="finalizado">Finalizado (rojo)</option></select>
   <button class="btn g" id="fClear">Limpiar</button>
  </div>
  <div id="downloads"><h2>Descargas por expediente <button class="btn g" id="logout" style="float:right">Salir</button></h2><div id="exps"></div></div>
 </main>
 <nav><button id="t1" class="on">Mapa</button><button id="t2">Descargas</button></nav>
</div>

<div class="modal" id="addModal"><div class="card">
 <h3 id="mTitle">Añadir expediente</h3>
 <input id="expName" placeholder="Nombre del expediente">
 <datalist id="tiposList"></datalist>
 <div id="rows"></div>
 <button class="btn g" id="addRow">+ Parcela</button>
 <div style="margin-top:12px"><button class="btn" id="save">Guardar</button><button class="btn g" id="cancel">Cancelar</button></div>
</div></div>
<div class="modal" id="auth"><div class="card">
 <h2>Expedientes</h2>
 <input id="aMail" type="email" placeholder="Correo electrónico" autocomplete="email">
 <input id="aPass" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password">
 <div id="aErr" style="color:#dc2626;font-size:14px;min-height:20px;margin-top:4px"></div>
 <div style="margin-top:8px"><button class="btn" id="aIn">Entrar</button><button class="btn g" id="aUp">Crear cuenta</button></div>
</div></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ====== CONFIG ======
const CFG={
 SUPABASE_URL:'https://nodyssmvqnbrrthrniwn.supabase.co',
 SUPABASE_KEY:'sb_publishable_RM5C0Ae-2VniCoAp3JHlag_mIz07Z36',
 BACKEND_URL:'https://auditoria-back-9ga7.onrender.com', // solo fallback para SIGPAC (CORS)
 BUCKET:'fotos'
};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=r=>String(r||'').split(/[:\-\s,.\/]+/).filter(Boolean).join('/');
const safe=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\\/:*?"<>|]+/g,'_').trim();
const norm=t=>{t=t.trim();return t?t[0].toUpperCase()+t.slice(1).toLowerCase():''};
const TIPOS=['Olivar','Cítrico','Cereal','Viñedo','Frutal','Hortícola','Otro'];
const COLOR={pendiente:'#22c55e',en_curso:'#eab308',finalizado:'#ef4444'};
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const $=id=>document.getElementById(id);
const toast=t=>{const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)};

const map=L.map('map').setView([37.4,-5.98],8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
const layer=L.featureGroup().addTo(map);
let EXPS=[],PARS=[],FOTOS=[],currentPar=null;

async function load(){
 const [e,p,f]=await Promise.all([
  sb.from('expedientes').select('*').order('created_at'),
  sb.from('parcelas').select('*'),
  sb.from('fotos').select('*').order('created_at')]);
 if(e.error||p.error||f.error)return toast('Error cargando datos');
 EXPS=e.data;PARS=p.data;FOTOS=f.data;buildFilters();draw();renderExps();
}
const expName=id=>(EXPS.find(x=>x.id===id)||{}).nombre||'';
const nFotos=pid=>FOTOS.filter(f=>f.parcela_id===pid).length;

const F={exp:'',tipo:'',estado:''};
function expEstado(id){
 const ps=PARS.filter(p=>p.expediente_id===id);
 if(!ps.length)return 'pendiente';
 if(ps.every(p=>p.estado==='finalizado'))return 'finalizado';
 if(ps.every(p=>p.estado==='pendiente'))return 'pendiente';
 return 'en_curso';
}
function pasa(p){
 return(!F.exp||p.expediente_id===F.exp)&&(!F.tipo||p.tipo===F.tipo)&&(!F.estado||expEstado(p.expediente_id)===F.estado);
}
function buildFilters(){
 const opt=(v,t)=>`<option value="${esc(v)}">${esc(t)}</option>`;
 $('fExp').innerHTML=opt('','Todos')+EXPS.map(e=>opt(e.id,e.nombre)).join('');
 const tipos=[...new Set(PARS.map(p=>p.tipo).filter(Boolean))];
 $('fTipo').innerHTML=opt('','Todos')+tipos.map(t=>opt(t,t)).join('');
 $('tiposList').innerHTML=[...new Set([...TIPOS,...tipos])].map(t=>`<option value="${esc(t)}">`).join('');
 $('fExp').value=F.exp;$('fTipo').value=F.tipo;$('fEstado').value=F.estado;
}
$('filtBtn').onclick=()=>{const f=$('filt');f.style.display=f.style.display==='block'?'none':'block'};
['fExp','fTipo','fEstado'].forEach(id=>$(id).onchange=()=>{
 F.exp=$('fExp').value;F.tipo=$('fTipo').value;F.estado=$('fEstado').value;
 draw.fit=0;draw();
 $('filtBtn').textContent=(F.exp||F.tipo||F.estado)?'Filtros ●':'Filtros';
});
$('fClear').onclick=()=>{F.exp=F.tipo=F.estado='';buildFilters();draw.fit=0;draw();$('filtBtn').textContent='Filtros'};

function draw(){
 layer.clearLayers();
 PARS.forEach(p=>{
  if(!p.geom||!pasa(p))return;
  const c=COLOR[p.estado]||COLOR.pendiente;
  const g=L.geoJSON(p.geom,{style:{color:c,fillColor:c,fillOpacity:.45,weight:2}});
  g.eachLayer(l=>l.bindTooltip(esc(expName(p.expediente_id)),{permanent:true,direction:'center',className:'plab'}));
  g.on('click',()=>openPopup(p)).addTo(layer);
 });
 if(layer.getLayers().length&&!draw.fit){map.fitBounds(layer.getBounds(),{maxZoom:17});draw.fit=1}
}

function centroid(p){const b=L.geoJSON(p.geom).getBounds().getCenter();return b}
function openPopup(p){
 const el=document.createElement('div');
 const n=nFotos(p.id);
 el.innerHTML=`<b>SIGPAC:</b> ${fmt(p.ref_sigpac)}<br><b>Expediente:</b> ${esc(expName(p.expediente_id))}<br><b>Tipo:</b> ${esc(p.tipo||'-')}<br><b>Fotos:</b> ${n}<br>`;
 const add=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;el.appendChild(b)};
 const c=centroid(p);
 add('Ir','b',()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving`,'_blank'));
 add('Añadir foto','',()=>{currentPar=p;$('file').click()});
 if(n>0&&p.estado!=='finalizado')add('Finalizado','r',()=>finalizar(p));
 add('Editar expediente','g',()=>{map.closePopup();openEdit(EXPS.find(x=>x.id===p.expediente_id))});
 L.popup().setLatLng(c).setContent(el).openOn(map);
}

map.on('zoomend',()=>$('map').classList.toggle('nolab',map.getZoom()<12));
// ====== FOTOS ======
function resize(file,max=1600){return new Promise(async res=>{
 const bm=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bm.width,bm.height));
 const cv=document.createElement('canvas');cv.width=bm.width*k;cv.height=bm.height*k;
 cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);cv.toBlob(res,'image/jpeg',.85)})}
$('file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||!currentPar)return;
 const p=currentPar;toast('Subiendo foto…');
 const blob=await resize(f);
 const path=`${uid}/${p.expediente_id}/${p.id}/${Date.now()}.jpg`;
 const up=await sb.storage.from(CFG.BUCKET).upload(path,blob,{contentType:'image/jpeg'});
 if(up.error)return toast('Error subiendo foto');
 const ins=await sb.from('fotos').insert({parcela_id:p.id,expediente_id:p.expediente_id,path});
 if(ins.error)return toast('Error guardando foto');
 if(p.estado==='pendiente')await sb.from('parcelas').update({estado:'en_curso'}).eq('id',p.id);
 map.closePopup();await load();toast('Foto guardada');
};
async function finalizar(p){
 if(!confirm('¿Marcar parcela como finalizada?'))return;
 await sb.from('parcelas').update({estado:'finalizado'}).eq('id',p.id);
 map.closePopup();load();
}

// ====== AÑADIR EXPEDIENTE ======
let editId=null,removed=[];
function addRow(ref='',tipo='',pid=null){
 const d=document.createElement('div');d.className='row';if(pid)d.dataset.pid=pid;
 d.innerHTML='<input class="ref" placeholder="Ref. SIGPAC (41/091/0/0/12/34/1)"><input class="tipo" list="tiposList" placeholder="Tipo (ej. Olivar)">'+(pid?'<button class="btn r x">✕</button>':'');
 d.querySelector('.ref').value=ref;d.querySelector('.tipo').value=tipo;
 if(pid){d.querySelector('.ref').disabled=true;d.querySelector('.x').onclick=()=>{removed.push(pid);d.remove()}}
 $('rows').appendChild(d);
}
$('fab').onclick=()=>{editId=null;removed=[];$('mTitle').textContent='Añadir expediente';$('expName').value='';$('rows').innerHTML='';addRow();$('addModal').style.display='flex'};
function openEdit(e){
 editId=e.id;removed=[];$('mTitle').textContent='Editar expediente';$('expName').value=e.nombre;$('rows').innerHTML='';
 PARS.filter(p=>p.expediente_id===e.id).forEach(p=>addRow(fmt(p.ref_sigpac),p.tipo||'',p.id));
 addRow();$('addModal').style.display='flex';
}
$('addRow').onclick=()=>addRow();
$('cancel').onclick=()=>$('addModal').style.display='none';

async function getGeom(ref){
 const p=ref.split(/[:\-\s,.\/]+/).filter(Boolean);
 if(p.length<6)throw new Error('Referencia incompleta');
 const path=p.length>=7?`recinfo/${p.slice(0,7).join('/')}`:`recinfoparc/${p.slice(0,6).join('/')}`;
 let j;
 try{const r=await fetch(`https://sigpac-hubcloud.es/servicioconsultassigpac/query/${path}.geojson`);if(!r.ok)throw 0;j=await r.json()}
 catch{const r=await fetch(`${CFG.BACKEND_URL}/sigpac/${p.slice(0,7).join('/')}`);if(!r.ok)throw new Error('No encontrada: '+ref);j=await r.json()}
 const f=(j.features||[j])[0];if(!f||!f.geometry)throw new Error('Sin geometría: '+ref);
 return f.geometry;
}
$('save').onclick=async()=>{
 const nombre=$('expName').value.trim();
 const all=[...document.querySelectorAll('#rows .row')];
 const olds=all.filter(r=>r.dataset.pid).map(r=>({id:r.dataset.pid,tipo:norm(r.querySelector('.tipo').value)}));
 const news=all.filter(r=>!r.dataset.pid).map(r=>({ref:fmt(r.querySelector('.ref').value),tipo:norm(r.querySelector('.tipo').value)})).filter(r=>r.ref);
 if(!nombre||(!olds.length&&!news.length))return toast('Pon nombre y al menos una parcela');
 $('save').disabled=true;if(news.length)toast('Buscando parcelas en SIGPAC…');
 try{
  const geoms=await Promise.all(news.map(r=>getGeom(r.ref)));
  let id=editId;
  if(id){
   let r=await sb.from('expedientes').update({nombre}).eq('id',id);if(r.error)throw r.error;
   await Promise.all(olds.map(o=>sb.from('parcelas').update({tipo:o.tipo}).eq('id',o.id)));
   if(removed.length){
    const paths=FOTOS.filter(f=>removed.includes(f.parcela_id)).map(f=>f.path);
    if(paths.length)await sb.storage.from(CFG.BUCKET).remove(paths);
    r=await sb.from('parcelas').delete().in('id',removed);if(r.error)throw r.error;
   }
  }else{
   const r=await sb.from('expedientes').insert({nombre}).select().single();if(r.error)throw r.error;id=r.data.id;
  }
  if(news.length){
   const r=await sb.from('parcelas').insert(news.map((r,i)=>({expediente_id:id,ref_sigpac:r.ref,tipo:r.tipo,geom:geoms[i],estado:'pendiente'})));
   if(r.error)throw r.error;
  }
  $('addModal').style.display='none';draw.fit=0;await load();toast(editId?'Expediente actualizado':'Expediente guardado');
 }catch(e){toast(e.message||'Error')}
 $('save').disabled=false;
};
async function delExp(e){
 if(!confirm('¿Eliminar "'+e.nombre+'" con todas sus parcelas y fotos? No se puede deshacer.'))return;
 const paths=FOTOS.filter(f=>f.expediente_id===e.id).map(f=>f.path);
 if(paths.length)await sb.storage.from(CFG.BUCKET).remove(paths);
 const {error}=await sb.from('expedientes').delete().eq('id',e.id);
 if(error)return toast(error.message);
 draw.fit=0;await load();toast('Expediente eliminado');
}

// ====== DESCARGAS ======
function renderExps(){
 $('exps').innerHTML='';
 EXPS.forEach(e=>{
  const n=FOTOS.filter(f=>f.expediente_id===e.id).length;
  const np=PARS.filter(p=>p.expediente_id===e.id).length;
  const d=document.createElement('div');d.className='exp';
  d.innerHTML=`<div><b>${esc(e.nombre)}</b><br><small>${np} parcelas · ${n} fotos</small></div>`;
  const bx=document.createElement('div');
  const add=(t,cls,fn,dis)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.disabled=!!dis;b.onclick=()=>fn(b);bx.appendChild(b)};
  add('Descargar ZIP','',b=>zipExp(e,b),!n);
  add('Editar','g',()=>openEdit(e));
  add('Eliminar','r',()=>delExp(e));
  d.appendChild(bx);$('exps').appendChild(d);
 });
}
async function caption(blob,text){
 const bm=await createImageBitmap(blob);const h=Math.max(40,bm.height*.06);
 const cv=document.createElement('canvas');cv.width=bm.width;cv.height=bm.height+h;
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
 x.drawImage(bm,0,0);x.fillStyle='#111';x.font=`bold ${h*.45}px sans-serif`;x.textBaseline='middle';
 x.fillText(text,12,bm.height+h/2,cv.width-24);
 return new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
}
async function zipExp(e,btn){
 const txt=btn.textContent;btn.disabled=true;
 const zip=new JSZip();const fs=FOTOS.filter(f=>f.expediente_id===e.id);const base=safe(e.nombre)||'expediente';let k=0;
 for(let i=0;i<fs.length;i++){
  btn.textContent=`${i+1}/${fs.length}`;
  const par=PARS.find(p=>p.id===fs[i].parcela_id);const ref=par?par.ref_sigpac:'sin-ref';
  try{
   const dl=await sb.storage.from(CFG.BUCKET).download(fs[i].path);
   if(dl.error)throw dl.error;
   const blob=dl.data;
   const out=await caption(blob,`${e.nombre} · SIGPAC ${fmt(ref)}`);
   zip.file(`${base}_${++k}.jpg`,out);
  }catch{}
 }
 const z=await zip.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(z);a.download=`${base}.zip`;a.click();
 btn.textContent=txt;btn.disabled=false;
}

// ====== GEOLOCALIZACIÓN ======
let me=null,acc=null,watchId=null;
function showMe(pos){
 const ll=[pos.coords.latitude,pos.coords.longitude];
 if(!me){
  me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map);
  acc=L.circle(ll,{radius:pos.coords.accuracy,color:'#2563eb',weight:1,fillOpacity:.1}).addTo(map);
 }else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(pos.coords.accuracy)}
 return ll;
}
$('geo').onclick=()=>{
 if(!navigator.geolocation)return toast('Geolocalización no disponible');
 if(me)map.setView(me.getLatLng(),Math.max(map.getZoom(),17));
 if(watchId!==null)return;
 let first=true;
 watchId=navigator.geolocation.watchPosition(pos=>{
  const ll=showMe(pos);if(first){map.setView(ll,17);first=false}
 },()=>{toast('No se pudo obtener la ubicación');watchId=null},{enableHighAccuracy:true});
};

// ====== PESTAÑAS ======
function tab(n){
 $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
 $('map').style.display=n===1?'block':'none';$('fab').style.display=n===1?'block':'none';$('geo').style.display=$('fab').style.display;$('filtBtn').style.display=$('fab').style.display;if(n===2)$('filt').style.display='none';
 $('downloads').style.display=n===2?'block':'none';if(n===1)map.invalidateSize();
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
// ====== CUENTAS ======
let uid=null;
const showAuth=v=>$('auth').style.display=v?'flex':'none';
const aMsg=t=>{$('aErr').textContent=t||''};
async function authGo(kind){
 const email=$('aMail').value.trim(),password=$('aPass').value;
 if(!email||password.length<6)return aMsg('Escribe un correo y una contraseña de al menos 6 caracteres');
 aMsg('Un momento…');$('aIn').disabled=$('aUp').disabled=true;
 try{
  const r=kind==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(r.error)aMsg(r.error.message);
  else if(kind==='up'&&!r.data.session)aMsg('Cuenta creada. Revisa tu correo para confirmarla y luego pulsa Entrar.');
  else aMsg('');
 }catch(e){aMsg('Error: '+(e.message||e))}
 $('aIn').disabled=$('aUp').disabled=false;
}
$('aIn').onclick=()=>authGo('in');
$('aUp').onclick=()=>authGo('up');
$('logout').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev,s)=>{
 const id=s&&s.user?s.user.id:null;
 if(id===uid)return;uid=id;
 if(id){showAuth(false);draw.fit=0;load()}
 else{EXPS=[];PARS=[];FOTOS=[];draw();renderExps();showAuth(true)}
});
sb.auth.getSession().then(({data})=>{if(!data.session)showAuth(true)});
</script></body></html>
